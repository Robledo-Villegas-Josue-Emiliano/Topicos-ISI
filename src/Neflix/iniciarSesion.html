<!doctype html>
<html lang="en">
<head>
    <style>
        body {
            background-image: url("img/hero-img.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000; color: white;
        }

    </style>
</head>
<body>
    <div style="padding: 25px 40px;">
            <img src="./img/logo.svg" alt="Netflix" style="height: 45px;">
    </div>
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">

        <div style="background-color: rgba(0, 0, 0, 0.75); padding: 60px 68px 40px; border-radius: 4px; width: 100%; max-width: 314px; display: flex; flex-direction: column;">

            <h1 style="margin: 0 0 28px 0; font-size: 32px; font-weight: bold;">Sign In</h1>

            <input type="text" placeholder="Email or phone number" style="background-color: #333; border: none; border-radius: 4px; color: white; height: 50px; padding: 0 20px; margin-bottom: 16px; font-size: 16px;">

            <input type="password" placeholder="Password" style="background-color: #333; border: none; border-radius: 4px; color: white; height: 50px; padding: 0 20px; margin-bottom: 35px; font-size: 16px;">

            <button style="background-color: #e50914; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; padding: 16px; margin-bottom: 12px;">
                Sign In
            </button>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #b3b3b3;">
                    <span style="display: flex; align-items: center;">
                        <input type="checkbox" checked style="margin-right: 5px; accent-color: #b3b3b3; width: 16px; height: 16px;">
                        Remember me
                    </span>
                <span>Need help?</span>
            </div>

            <div style="margin-top: 50px; color: #737373; font-size: 16px;">
                New to Netflix? <span style="color: white;">Sign up now</span>
            </div>

            <div style="margin-top: 15px; color: #8c8c8c; font-size: 13px; line-height: 1.4;">
                This page is protected by Google reCAPTCHA to ensure you're not a bot.
                <span style="color: #0071eb;">Learn more.</span>
            </div>

        </div>
    </div>
</body>
</html>
