<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tabla de Colores</title>
</head>
<body>

<style>
    table{
        width: 50%;
        margin: auto;
        border-collapse: collapse;
    }



</style>

<br>
<br>
<br>
<br>
    <table>

        <tr>
            <td style="background-color: orange; width: 55px; height: 55px"></td>
            <td style="background-color: cornflowerblue; width: 55px; height: 55px"></td>
            <td rowspan="2" style="background-color: orange; width: 55px; height: 110px"></td>
            <td rowspan="2" style="background-color: red; width: 200px; height: 110px"></td>
        </tr>

        <tr>
            <td style="background-color: red; width: 55px; height: 55px"></td>
            <td style="background-color: lightgreen; width: 55px; height: 55px"></td>
        </tr>

        <tr>
            <td colspan="3" style="background-color: cornflowerblue; width: 165px; height: 110px"></td>
            <td style="background-color: lightgreen; width: 200px; height: 110px"></td>
        </tr>

        <tr>
            <td rowspan="2" style="background-color: orange; width: 55px; height: 110px"></td>
            <td style="background-color: red; width: 55px; height: 55px"></td>
            <td style="background-color: lightgreen; width: 55px; height: 55px"></td>
            <td rowspan="2" style="background-color: red; width: 200px; height: 110px"></td>
        </tr>

        <tr>
            <td style="background-color: cornflowerblue; width: 55px; height: 55px"></td>
            <td style="background-color: orange; width: 55px; height: 55px"></td>
        </tr>

    </table>



</body>
</html>
