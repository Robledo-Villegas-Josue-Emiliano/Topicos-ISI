<!doctype html>
<html lang="en">
<head>
    <style>

        .colorPan {
            background-color: #edb45e;
        }

        .colorCarne {
            background-color: #593e30;
        }

        .colorTomate {
            background-color: #b82614;
        }

        .colorCebolla {
            background-color: #7d214d;
        }

        .colorLechuga {
            background-color: #70a641;
        }

        .colorQueso {
            background-color: #fab839;
        }

        #Pan01 {
            border-top-left-radius: 100%;
            height: 200px;
            width: 200px;
            top: 100px;
            left: 125px;
            position: absolute;
        }

        #Pan02 {
            height: 200px;
            width: 50px;
            top: 100px;
            left: 325px;
            position: absolute;
        }

        #Pan03 {
            border-top-right-radius: 100%;
            height: 200px;
            width: 200px;
            top: 100px;
            left: 375px;
            position: absolute;
        }

        #tomate01 {
            height: 30px;
            width: 125px;
            top: 300px;
            left: 200px;
            position: absolute;
        }

        #tomate02 {
            height: 30px;
            width: 125px;
            top: 300px;
            left: 375px;
            position: absolute;
        }

        #cebolla {
            height: 30px;
            width: 450px;
            top: 330px;
            left: 125px;
            position: absolute;
        }

        #lechugaIzquierda {
            border-top-left-radius: 100%;
            border-bottom-left-radius: 100%;
            height: 35px;
            width: 50px;
            top: 360px;
            left: 100px;
            position: absolute;
        }

        #lechuga {
            height: 34px;
            width: 450px;
            top: 360px;
            left: 125px;
            position: absolute;
        }

        #lechugaDerecha {
            border-top-right-radius: 100%;
            border-bottom-right-radius: 100%;
            height: 35px;
            width: 50px;
            top: 360px;
            left: 550px;
            position: absolute;
        }

        #CarneIzquierda {
            width: 50px;
            height: 50px;
            top: 395px;
            left: 110px;
            position: absolute;
            border-radius: 50px;
        }

        #Carne {
            width: 420px;
            height: 50px;
            top: 415px;
            left: 130px;
            margin-top: -20px;
            position: absolute;
            z-index: 1;
        }

        #CarneDerecha {
            width: 50px;
            height: 50px;
            top: 395px;
            left: 530px;
            position: absolute;
            border-radius: 50px;
        }

        #Queso {
            width: 420px;
            height: 50px;
            top: 385px;
            left: 120px;
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            position: relative;
            z-index: 2;
        }

        #Pan04 {
            border-bottom-left-radius: 60%;
            width: 200px;
            height: 70px;
            top: 445px;
            left: 125px;
            position: absolute;
        }

        #Pan05 {
            width: 50px;
            height: 70px;
            top: 445px;
            left: 325px;
            position: absolute;
        }

        #Pan06 {
            border-bottom-right-radius: 60%;
            width: 200px;
            height: 70px;
            top: 445px;
            left: 375px;
            position: absolute;
        }

    </style>


</head>
<body>
    <div id="Pan01" class="colorPan"></div>
    <div id="Pan02" class="colorPan"></div>
    <div id="Pan03" class="colorPan"></div>

    <div id="tomate01" class="colorTomate"></div>
    <div id="tomate02" class="colorTomate"></div>

    <div id="cebolla" class="colorCebolla"></div>

    <div id="lechugaIzquierda" class="colorLechuga"></div>
    <div id="lechuga" class="colorLechuga"></div>
    <div id="lechugaDerecha" class="colorLechuga"></div>

    <div id="Queso" class="colorQueso"></div>

    <div id="CarneIzquierda" class="colorCarne"></div>
    <div id="Carne" class="colorCarne"></div>
    <div id="CarneDerecha" class="colorCarne"></div>

    <div id="Pan04" class="colorPan"></div>
    <div id="Pan05" class="colorPan"></div>
    <div id="Pan06" class="colorPan"></div>

</body>
</html>
